name: Diagnose school login endpoints
on:
  push:
    branches: [verify/icourse-auth-36a1d6d]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Measure anonymous endpoint timing
        shell: bash
        run: |
          probe() {
            echo "start $1"
            curl -s -4 --max-time 100 -o /dev/null -w "PROBE $1 status=%{http_code} ip=%{remote_ip} tcp=%{time_connect} tls=%{time_appconnect} first=%{time_starttransfer} total=%{time_total}\n" "$2" || true
          }
          probe portal https://webvpn.fudan.edu.cn/login &
          probe cas 'https://webvpn.fudan.edu.cn/login?cas_login=true' &
          probe root https://webvpn.fudan.edu.cn/ &
          probe idp 'https://id.fudan.edu.cn/idp/authCenter/authenticate?service=https%3A%2F%2Fwebvpn.fudan.edu.cn%2Flogin%3Fcas_login%3Dtrue' &
          probe icourse https://icourse.fudan.edu.cn/userapi/v1/infosimple &
          wait
